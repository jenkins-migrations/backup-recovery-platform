# Migrated from: Jenkinsfile (root)
# Original source: https://github.com/jenkinsci/pipeline-examples (MIT License)
# Original pattern: Multi-node parallel builds across different OS platforms
# ('precise', 'trusty' Jenkins node labels are legacy Ubuntu 12.04/14.04 agents;
#  both ran identical Unix build steps, so they are preserved here as separate
#  matrix entries mapped onto the current ubuntu-latest runner to keep the
#  original 3-way parallel fan-out semantics, while 'windows' maps to windows-latest).
name: Multi-Platform Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: precise
            os: ubuntu-latest
          - label: trusty
            os: ubuntu-latest
          - label: windows
            os: windows-latest
    steps:
      # actions/checkout v4.2.2, pinned to commit SHA per security guardrails
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Test (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: test.bat

      # actions/upload-artifact v4.4.3, pinned to commit SHA per security guardrails
      # Replaces Jenkins `archiveArtifacts artifacts: 'build/**/*', fingerprint: true`
      - name: Archive build artifacts (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-${{ matrix.label }}
          path: build/**/*
          if-no-files-found: warn

      - name: Archive build artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: build-${{ matrix.label }}
          path: build\**\*
          if-no-files-found: warn
